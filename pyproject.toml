[project]
name = "taskhub"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
